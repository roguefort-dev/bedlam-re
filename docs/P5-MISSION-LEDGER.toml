schema = "p5-mission-ledger-v1"

# P5 per-mission parity disposition ledger (schema p5-mission-ledger-v1).
# Format specified by docs/P5-ZONE-GATES.md (D175). Every mission starts
# 'pending'; 'green' requires the zone acceptance shape of PLAN §6 P5 to
# hold for the mission. Zone status is DERIVED (all missions green), never
# stored. catalog_refs = original-behavior catalog entry ids (P6 triage
# feed); empty until disposition work begins.
# Enumerated READ-ONLY from game-data/BEDLAM/EDITOR/ZONE*/MISSION*.TOT
# (37 missions: ZONEA M1; ZONEB..F M1-7 each; ZONEG M1; MANIFEST.sha256
# clean before and after, 2026-08-27). Machine-checked by
# tools/check-p5-zone-ledger.py (fail-closed).

