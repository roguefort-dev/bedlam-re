schema = "p5-mission-ledger-v2"

# P5 per-mission ledger (schema p5-mission-ledger-v2, the D238 revocation
# of schema p5-mission-ledger-v1). v1's `green` let replay/oracle parity
# evidence certify missions complete without any natural product-path
# journey; the audit found all 37 such greens unproven as product claims
# (headless evidence injects SceneAction::MissionComplete and production
# MissionScene::tick returns no outcome). v2 splits the two concerns:
#   disposition         the PRODUCT claim — "unproven" until a natural
#                       product journey proves the mission; "green" again
#                       only with product-path evidence (checker-enforced:
#                       a green row must cite a product gate in
#                       supporting_evidence).
#   supporting_evidence the preserved v1-era parity evidence (the
#                       p5-zone-{a..g} replay/oracle gates) — still real,
#                       still required-gates-manifest evidence, and never
#                       sufficient for a product green.
# catalog_refs = original-behavior catalog entry ids (P6 triage feed).
# Zone status stays DERIVED, never stored. Machine-checked by
# tools/check-p5-zone-ledger.py (fail-closed); mission set enumerated
# READ-ONLY from game-data/BEDLAM/EDITOR/ZONE*/MISSION*.TOT (37 missions:
# ZONEA M1; ZONEB..F M1-7 each; ZONEG M1; MANIFEST.sha256 clean before and
# after, 2026-09-02).

[[mission]]
id = "ZONEA-MISSION1"
zone = "A"
mission = 1
disposition = "unproven"
supporting_evidence = ["p5-zone-a"]
catalog_refs = []

