# and the cross-OS channel status lives in docs/P5-ZONE-GATES.md §7.
[[gate]]
id = "p5-zone-a"
timeout_seconds = 1800
commands = [
  ["/usr/bin/cargo", "test", "--release", "--locked", "--offline", "-p", "bedlam-game", "--test", "zonea_mission1_parity", "--test", "canonical_dump_gate", "--test", "differ_gate", "--test", "mission_scene_gate", "--test", "determinism"],
  ["/usr/bin/cargo", "test", "--release", "--locked", "--offline", "-p", "bedlam-core", "--test", "hash_fixture", "--test", "mission_corpus_gate"],
]
tracked_paths = ["engine/bedlam-game/tests/zonea_mission1_parity.rs", "engine/bedlam-game/src/save.rs", "engine/bedlam-game/src/host.rs", "engine/bedlam-game/src/lib.rs", "engine/bedlam-game/examples/parity_harness/canonical.rs", "engine/bedlam-game/tests/canonical_dump_gate.rs", "engine/bedlam-game/tests/differ_gate.rs", "engine/bedlam-game/tests/mission_scene_gate.rs", "engine/bedlam-game/tests/determinism.rs", "engine/bedlam-core/tests/hash_fixture.rs", "engine/bedlam-core/tests/mission_corpus_gate.rs", "docs/P5-ZONE-GATES.md", "docs/P5-MISSION-LEDGER.toml", "docs/required-gates.toml", "docs/RE-EXW-SIM.md"]
corpus = ["tools/diffharness/scenarios/S0.scen", "tools/diffharness/scenarios/S1.scen", "tools/diffharness/scenarios/S2.scen", "tools/diffharness/scenarios/S3.scen", "tools/diffharness/scenarios/S4.scen", "tools/diffharness/scenarios/S6.scen", "tools/diffharness/scenarios/S7.scen", "tools/diffharness/scenarios/S8.scen"]

