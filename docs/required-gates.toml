[[phase]]
id = "P1"
status = "green"
required_gates = []

[[phase]]
id = "P2"
status = "green"
required_gates = []

[[phase]]
id = "P3"
status = "green"
required_gates = []

[[phase]]
id = "P4"
status = "green"
required_gates = ["trigger-address", "dependency-spikes", "s0-dispositions", "scripted-slice-scenes", "diffharness-plumbing", "gates-validator", "env-probe", "p4-machine-verdict"]

