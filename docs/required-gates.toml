[[gate]]
id = "trigger-address"
timeout_seconds = 900
commands = [
  ["/usr/bin/cargo", "test", "--release", "--locked", "--offline", "-p", "diffharness", "--bin", "dbx-plan"],
  ["/bin/bash", "tools/runtime/capgen-o2-smoke.sh"],
  ["/usr/bin/python3", "tools/check-p4-trigger-contract.py"],
]
tracked_paths = ["tools/diffharness/watches.toml", "tools/diffharness/src/bin/dbx-plan.rs", "tools/diffharness/capture-plans/S1-o2.json", "tools/runtime/capgen-o2-smoke.sh", "tools/check-p4-trigger-contract.py"]
# The smoke writes runtime/harness-out (gitignored); the validator binds a
# private scratch directory over every declared writable path.
writable = ["runtime/harness-out"]

[[gate]]
id = "dependency-spikes"
timeout_seconds = 1800
commands = [
  ["/usr/bin/cargo", "test", "--release", "--locked", "--offline", "-p", "bedlam-platform"],
  ["/usr/bin/cargo", "build", "--release", "--locked", "--offline", "-p", "bedlam-shell"],
]
tracked_paths = ["Cargo.lock", "engine/bedlam-platform/src/gpu.rs", "docs/DECISIONS.md"]

# s0-dispositions — the D145-D164 closed static evidence and timing
# dispositions made executable. The 27-row S0 registry (watches.toml) is
# FULLY DISPOSITIONED (D160 final ledger): 24/27 static-closed + 2/27
# dynamic-only placement (D156: s0-trigger + frame-counter — closed by
# mechanism, the ordering oracle) + 1/27 hardware/input-profile-only
# (D160: static-cursor-clamp — never counted as static parity). The four
# commands run every oracle suite that proves the rows:
#   bedlam-core, 7 suites / 16 tests — pad-slots D146, yline-zbase D147,
#     type-table D148, min-bank D149, claim-bank D150+D151, and the
#     pre-D145 cgr-volume + TOT-driven DAT/PAD loader rows.
#   bedlam-game, 6 suites / 42 tests — campaign/config D153+D154, RNG +
#     dither D155, frame-counter/s0-trigger ordering D156 (the timing
#     dispositions), order-table D157, player-type D159, cursor-clamp D160.
#   bedlam-render lib, 30 tests — the mission-view load-seam oracle
#     (EXW TOT/DAT/BIN/LNK transform: the tot-volume, dat-volume,
#     bin-terrain, lnk-map, map-wh TS rows).
#   diffharness registry_anchors, 2 tests — the registry substrate guard
#     (W2 anti-ghost: every watch anchor resolves to its ledger row; the
#     D161/D162 verified EXD fills stay anchored).
# Excluded by design — never P4 gates, never queued: S0W menu calibration,
# live O1/O2/O3 captures, cycles/audio listening, hardware, perceptual
# checks. The S0-S8 corpus gates and the differ_gate plumbing gate are
# separate automated gates and are not duplicated here.
[[gate]]
id = "s0-dispositions"
timeout_seconds = 1800
commands = [
  ["/usr/bin/cargo", "test", "--release", "--locked", "--offline", "-p", "bedlam-core", "--test", "static_cgr_differential", "--test", "static_claim_bank_differential", "--test", "static_loader_differential", "--test", "static_min_bank_differential", "--test", "static_pad_slot_differential", "--test", "static_type_table_differential", "--test", "static_yline_zbase_differential"],
  ["/usr/bin/cargo", "test", "--release", "--locked", "--offline", "-p", "bedlam-game", "--test", "static_campaign_config_differential", "--test", "static_cursor_clamp_differential", "--test", "static_frame_counter_differential", "--test", "static_order_table_differential", "--test", "static_player_type_differential", "--test", "static_rng_differential"],
  ["/usr/bin/cargo", "test", "--release", "--locked", "--offline", "-p", "bedlam-render", "--lib"],
  ["/usr/bin/cargo", "test", "--release", "--locked", "--offline", "-p", "diffharness", "--test", "registry_anchors"],
]
tracked_paths = ["engine/bedlam-core/tests/static_cgr_differential.rs", "engine/bedlam-core/tests/static_claim_bank_differential.rs", "engine/bedlam-core/tests/static_loader_differential.rs", "engine/bedlam-core/tests/static_min_bank_differential.rs", "engine/bedlam-core/tests/static_pad_slot_differential.rs", "engine/bedlam-core/tests/static_type_table_differential.rs", "engine/bedlam-core/tests/static_yline_zbase_differential.rs", "engine/bedlam-game/tests/static_campaign_config_differential.rs", "engine/bedlam-game/tests/static_cursor_clamp_differential.rs", "engine/bedlam-game/tests/static_frame_counter_differential.rs", "engine/bedlam-game/tests/static_order_table_differential.rs", "engine/bedlam-game/tests/static_player_type_differential.rs", "engine/bedlam-game/tests/static_rng_differential.rs", "tools/diffharness/tests/registry_anchors.rs", "tools/diffharness/watches.toml", "docs/PLAN.md", "docs/DESIGN-DIFFHARNESS.md", "docs/RUNTIME.md", ".state/STATE.md"]
corpus = ["tools/diffharness/capture-plans/S0.json", "tools/diffharness/capture-plans/S1.json", "tools/diffharness/capture-plans/S2.json", "tools/diffharness/capture-plans/S3.json", "tools/diffharness/capture-plans/S4.json", "tools/diffharness/capture-plans/S5.json", "tools/diffharness/capture-plans/S5B.json", "tools/diffharness/capture-plans/S5C.json", "tools/diffharness/capture-plans/S6.json", "tools/diffharness/capture-plans/S7.json", "tools/diffharness/capture-plans/S8.json"]

[[gate]]
id = "scripted-slice-scenes"
timeout_seconds = 1800
commands = [["/usr/bin/cargo", "test", "--release", "--locked", "--offline", "-p", "bedlam-game", "--test", "canonical_dump_gate"]]
tracked_paths = ["engine/bedlam-game/tests/canonical_dump_gate.rs"]
corpus = ["tools/diffharness/scenarios/S0.scen", "tools/diffharness/scenarios/S1.scen", "tools/diffharness/scenarios/S2.scen", "tools/diffharness/scenarios/S3.scen", "tools/diffharness/scenarios/S4.scen", "tools/diffharness/scenarios/S5.scen", "tools/diffharness/scenarios/S5B.scen", "tools/diffharness/scenarios/S5C.scen", "tools/diffharness/scenarios/S6.scen", "tools/diffharness/scenarios/S7.scen", "tools/diffharness/scenarios/S8.scen"]

[[gate]]
id = "diffharness-plumbing"
timeout_seconds = 1800
commands = [["/usr/bin/cargo", "test", "--release", "--locked", "--offline", "-p", "bedlam-game", "--test", "differ_gate"]]
tracked_paths = ["engine/bedlam-game/tests/differ_gate.rs", "tools/diffharness/src/differ.rs"]
corpus = ["tools/diffharness/tests/fixtures/s0-replay.dbxcap"]

[[gate]]
id = "gates-validator"
timeout_seconds = 120
commands = [["/usr/bin/python3", "tools/test-validate-required-gates.py"]]
tracked_paths = ["tools/validate-required-gates.py", "tools/test-validate-required-gates.py", "docs/required-gates.toml"]

# env-probe — CONTAINMENT EVIDENCE, not a project gate. The command runs
# under the validator's own bwrap containment and fails closed unless the
# environment matches the documented contract (no PATH, no proxy/wrapper
# variables, per-command scratch HOME under target/, fresh private /tmp
# holding only the invocation root's own chain when the controller roots
# the sealed basis under /tmp, read-only repository root) and the declared
# writable scratch directory is usable. It records the observed
# environment as JSON evidence in the writable scratch. Kept in the same
# manifest so the machinery that runs the real gates also proves the
# sandbox those gates run in.
[[gate]]
id = "env-probe"
timeout_seconds = 60
commands = [["/usr/bin/python3", "tools/check-gates-env.py"]]
tracked_paths = ["tools/check-gates-env.py", "docs/required-gates.toml"]
writable = ["runtime/env-probe-out"]

[[gate]]
id = "p4-machine-verdict"
timeout_seconds = 1
depends = ["trigger-address", "dependency-spikes", "s0-dispositions", "scripted-slice-scenes", "diffharness-plumbing", "gates-validator", "env-probe"]

# p5-zone-gate-scaffold — the P5 opener per PLAN §6 (D175): the per-zone
# parity LEDGER (docs/P5-MISSION-LEDGER.toml, schema p5-mission-ledger-v1,
# every mission starts pending) plus its fail-closed checker. The checker
# re-enumerates the 37 shipped missions READ-ONLY from the game-data corpus
# (ZONEA M1; ZONEB..F M1-7 each; ZONEG M1) and validates ledger
# completeness + internal consistency: exactly those missions, valid
# zones/dispositions/ids, ledger set == corpus set, and cross-artifact
# safety with this manifest (a p5-zone-{a..g} completion gate may only be
# wired once its zone is fully green; P5 status green requires all 37
# green). game-data is never git-tracked: no corpus path may appear in
# tracked_paths/corpus — the checker reads the corpus read-only at runtime,
# the MANIFEST.sha256 contract. Per-zone completion gates land here as each
# zone closes; P5 stays pending until every zone closes. The second command
# is the checker's fail-closed hermetic test suite (18 cases).
[[gate]]
id = "p5-zone-gate-scaffold"
timeout_seconds = 120
commands = [
  ["/usr/bin/python3", "tools/check-p5-zone-ledger.py"],
  ["/usr/bin/python3", "tools/test-p5-zone-ledger.py"],
]
tracked_paths = ["docs/P5-ZONE-GATES.md", "docs/P5-MISSION-LEDGER.toml", "tools/check-p5-zone-ledger.py", "tools/test-p5-zone-ledger.py", "docs/required-gates.toml"]

# p5-zone-a — the ZONEA completion gate (P5-ZONE-GATES §7, D178):
# ZONEA's only mission (ZONEA-MISSION1, the canonical corpus's own)
# flipped green in the same commit as this executable evidence — the
# §1 acceptance shape per criterion. Command 1 = the bedlam-game
# evidence: zonea_mission1_parity (the per-criterion aggregation
# gate: S-flow crash-free completion, T1 spot rules, the independent
# structural spot check, the §7j.70 SAVED/OPTIONS import seam over
# the real shipped files + bounded fuzz, the replay-stitch identity)
# + canonical_dump_gate (the pinned per-scenario chain digests) +
# differ_gate (the cross-channel structural spot check) +
# mission_scene_gate (the T2 key-moment frame/palette pins) +
# determinism (rate-invariance replay identity). Command 2 = the
# bedlam-core evidence: hash_fixture (the cross-OS replay-hash pins)
# + mission_corpus_gate (the T1 loader/rules oracles on the real
# ZONEA bytes). game-data is never git-tracked: no corpus path in
# tracked_paths/corpus (read-only runtime reads, the MANIFEST
# contract). The full §7 criterion table incl. the DM carve-out note
# and the cross-OS channel status lives in docs/P5-ZONE-GATES.md §7.
[[gate]]
id = "p5-zone-a"
timeout_seconds = 1800
commands = [
  ["/usr/bin/cargo", "test", "--release", "--locked", "--offline", "-p", "bedlam-game", "--test", "zonea_mission1_parity", "--test", "canonical_dump_gate", "--test", "differ_gate", "--test", "mission_scene_gate", "--test", "determinism"],
  ["/usr/bin/cargo", "test", "--release", "--locked", "--offline", "-p", "bedlam-core", "--test", "hash_fixture", "--test", "mission_corpus_gate"],
]
tracked_paths = ["engine/bedlam-game/tests/zonea_mission1_parity.rs", "engine/bedlam-game/src/save.rs", "engine/bedlam-game/src/host.rs", "engine/bedlam-game/src/lib.rs", "engine/bedlam-game/examples/parity_harness/canonical.rs", "engine/bedlam-game/tests/canonical_dump_gate.rs", "engine/bedlam-game/tests/differ_gate.rs", "engine/bedlam-game/tests/mission_scene_gate.rs", "engine/bedlam-game/tests/determinism.rs", "engine/bedlam-core/tests/hash_fixture.rs", "engine/bedlam-core/tests/mission_corpus_gate.rs", "docs/P5-ZONE-GATES.md", "docs/P5-MISSION-LEDGER.toml", "docs/required-gates.toml", "docs/RE-EXW-SIM.md"]
corpus = ["tools/diffharness/scenarios/S0.scen", "tools/diffharness/scenarios/S1.scen", "tools/diffharness/scenarios/S2.scen", "tools/diffharness/scenarios/S3.scen", "tools/diffharness/scenarios/S4.scen", "tools/diffharness/scenarios/S6.scen", "tools/diffharness/scenarios/S7.scen", "tools/diffharness/scenarios/S8.scen"]

# p5-zone-b — the ZONEB completion gate (P5-ZONE-GATES §8, D192):
# all SEVEN ZONEB missions flipped green in the same commit as this
# executable evidence (the cross-artifact rule: the §4 rule-5 check
# requires zone B fully green the moment this gate is wired). The
# per-criterion table lives in P5-ZONE-GATES §8. Command 1 = the
# bedlam-game evidence: zone_mission_parity (the GENERALIZED
# per-zone/per-mission suite — the D178 ZONEA shape lifted to a
# ZoneSpec parameter, instantiated for zone B: the committed ZONEB
# flows S5/S5B/S5C + the generated per-mission battery — boot,
# 120-frame passive, 48-frame full-staging destroy+pickup+
# platforms+critters — for ALL seven missions, campaigns 1-5 through
# the episode-slot mask seam and the MP files 6-7 through the SELECT
# write-pair seam, two-run byte identity + full declared budgets;
# the anchor TS/T0 statics re-derived independently from each TOT
# header + the §7j.64 formula; the T1 spot table incl. the D184
# zone-level CGR/BIN/LNK fetch pin + the seam domains; the shipped
# SAVED.BDL slot-0 campaign = ZONEB/MISSION1 import + bounded fuzz)
# + canonical_dump_gate (the pinned per-scenario chain digests — the
# zone-B flows' chains pinned; zero movement) + differ_gate (the
# cross-channel structural spot check) + determinism (rate-invariance
# replay identity). Command 2 = the bedlam-core evidence: hash_fixture
# (the cross-OS replay-hash pins) + mission_corpus_gate (the T1
# loader/rules oracles). game-data is never git-tracked: no corpus
# path in tracked_paths (read-only runtime reads, the MANIFEST
# contract). The scenario grammar v1.8 `mission` key + the canonical
# staging arm are part of this gate's tracked evidence.
[[gate]]
id = "p5-zone-b"
timeout_seconds = 1800
commands = [
  ["/usr/bin/cargo", "test", "--release", "--locked", "--offline", "-p", "bedlam-game", "--test", "zone_mission_parity", "--test", "canonical_dump_gate", "--test", "differ_gate", "--test", "determinism"],
  ["/usr/bin/cargo", "test", "--release", "--locked", "--offline", "-p", "bedlam-core", "--test", "hash_fixture", "--test", "mission_corpus_gate"],
]
tracked_paths = ["engine/bedlam-game/tests/zone_mission_parity.rs", "engine/bedlam-game/examples/parity_harness/canonical.rs", "tools/diffharness/src/runner.rs", "tools/diffharness/src/bin/dbx-plan.rs", "docs/P5-ZONE-GATES.md", "docs/P5-MISSION-LEDGER.toml", "docs/required-gates.toml"]
corpus = ["tools/diffharness/scenarios/S5.scen", "tools/diffharness/scenarios/S5B.scen", "tools/diffharness/scenarios/S5C.scen"]
