# DOSBox-X differential harness config - CANONICAL PIN (P4; D29)
# Target: game-data-2 = Bedlam II DOS build (BEDLAM.EXE + DOS4GW.EXE, LE).
# Bin pin: flathub com.dosbox_x.DOSBox-X 2026.08.02 @ fa89039c (RUNTIME.md).
#
# D29 POLICY: every value below is part of the golden baseline. NEVER
# tune a value to fix a diff - a change invalidates goldens; re-baseline
# deliberately per D19 and record it in DECISIONS.md.
#
# DEPLOYMENT: this file is the canon copy in tools/. The driver
# (dosbox-harness.sh prepare) copies it to runtime/harness-out/run.conf
# and appends the mounts, because the sandbox sees ONLY runtime/ (the
# flatpak static finish arg grants home rw - it is revoked by override,
# which is what makes game-data invisible and the corpus write-isolated).
# Option names + value semantics verified against the reference conf
# shipped inside the pinned flatpak.

[sdl]
fullscreen = false
output = surface
autolock = false

[render]
# Raw framebuffer for goldens: no scaler, no aspect correction.
scaler = none
aspect = false

[log]
# Integrated debugger in WATCH mode (game runs free, watches report).
# logfile is relative to the process CWD; the driver cds to
# runtime/harness-out so logs and dumps land in the scratch dir.
logfile = dosbox-harness.log
debuggerrun = watch

[dosbox]
# svga_s3: VESA VBE for mode 0x101 640x480x8 BANKED (B2 pages {0,5},
# not the LFB variant - census 7.7d). UNIVBE.EXE in the corpus is for
# hosts lacking VBE; svga_s3 supplies it natively - do NOT run UNIVBE.
machine = svga_s3
memsize = 16
# captures/saves land beside the run copy in runtime/harness-out/.
captures = captures

[video]
# VESA 0x101 dual page (2 x 300KB) + cursor block: 2MB pin.
# NOTE: 2026.08.02 keeps vmemsize in [video] (in [dosbox] it logs a
# harmless Redirect notice; pinned in the canonical section instead).
vmemsize = 2

[cpu]
# Interpreter core: watchpoint/debugger accuracy (dynamic recompilers
# make traps unreliable) + most reproducible core across hosts.
core = normal
cputype = pentium
# D29 STARTING PIN (calibration pending first interactive run):
# fixed 60k instructions/ms ~ Pentium-100 class; fixed = the per-frame
# cycle budget is host-independent. If audio starves at calibration,
# lower DELIBERATELY and re-baseline (D19).
cycles = fixed 60000
# Watcom codegen uses the FPU alongside Q16.16 fixed point.
fpu = true

[mixer]
# Sample-accurate mixing for audio goldens; host resample of the
# 11025 Hz native stream happens exactly once, reproducibly.
sample accurate = true
rate = 48000

[sblaster]
# SB16 at the standard 220/7/1/5 - the class the B2 HMI driver set
# (HMIDET.386/HMIDRV.386/HMIMDRV.386) probes for. Defaults, pinned.
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5

[autoexec]
# Mounts are appended by the driver to the runtime run.conf copy.
