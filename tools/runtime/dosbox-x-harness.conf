# DOSBox-X differential harness config (P4, PLAN sec 6 item 2; D29)
# TARGET: game-data-2 = Bedlam II DOS build (BEDLAM.EXE + DOS4GW.EXE, LE image)
# BIN PIN: flathub com.dosbox_x.DOSBox-X 2026.08.02 (see docs/RUNTIME.md)
# CONFIG PIN (D29): every value below is part of the golden baseline.
#   NEVER tune a value to fix a diff - changing one invalidates goldens;
#   re-baseline deliberately per D19 and record it in DECISIONS.md.
# All option names + value semantics verified against the reference conf
# shipped INSIDE the pinned flatpak (dosbox-x.reference.conf and .full.conf).
# Mounts live in tools/runtime/dosbox-harness.sh (it computes REPO_ROOT),
# NOT here: the sandbox sees host paths at their absolute locations via
# the flatpak filesystem override (game-data ro, scratch rw).

[sdl]
# Headless-friendly defaults for smoke runs; real watch runs use a desktop.
fullscreen = false
output = surface
autolock = false

[log]
# D29: the integrated debugger runs in WATCH mode - the game runs free and
# watches report without freezing emulation. logfile is relative to the
# sandbox working dir; the wrapper copies it to runtime/dosbox-harness/.
logfile = dosbox-harness.log
debuggerrun = watch

[dosbox]
# svga_s3 = VESA VBE for mode 0x101 640x480x8 banked (B2 uses banked pages
# {0,5}, NOT the LFB variant - census 7.7d). The corpus ships UNIVBE.EXE
# for hosts lacking VBE; svga_s3 supplies VBE natively so UNIVBE must NOT
# be run inside the sandbox.
machine = svga_s3
# DOS4GW protected-mode host: 16MB XMS is period-correct and ample.
memsize = 16
# VESA 0x101 dual page (2 x 300KB) + cursor block: 1MB would be minimal,
# 2MB is the pin (full reference vmemsize semantics: 0=512k 1=1MB 2=2MB).
vmemsize = 2

[cpu]
# Interpreter core: watchpoint/debugger accuracy (dynamic recompilers make
# traps unreliable) and the most reproducible core across hosts.
core = normal
# 1996 DOS4GW title class; pinned explicitly - auto resolves to a 486
# that tolerates Pentium instructions, a vaguer emulation target.
cputype = pentium
# D29 STARTING PIN, calibration pending the first interactive run:
# fixed budget of 60k instructions per ms (approx Pentium-100 class) so
# the cycle budget per frame is host-independent. If audio starves on
# the calibration run, lower DELIBERATELY and re-baseline (D19).
cycles = fixed 60000
# FPU present (Watcom codegen uses it alongside Q16.16 fixed point).
fpu = true

[autoexec]
# Mounts and the BEDLAM launch are injected by tools/runtime/dosbox-harness.sh
