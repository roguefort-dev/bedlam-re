# DOSBox-X SELF-BUILD probe conf — DH-G0 channel re-pin (D80, 2026-08-22)
#
# Same D29 pins as dosbox-x-harness.conf (that file stays the canon for
# game runs), with TWO deliberate differences for the headless channel
# probe:
#   1. debuggerrun = debugger  (mode 0: -break-start drops to the prompt
#      and SITS there — mode "watch" would auto-RUNWATCH before the probe
#      can arm its BPINT surrogate; the probe sends RUNWATCH itself).
#   2. NO game launch: [autoexec] stays empty (no mounts, no BEDLAM.EXE).
#      The probe never touches the corpus — plumbing proof only.
#
# Binary: runtime/dosbox-x-build/src/dosbox-x (--enable-debug=heavy at
# upstream e522642 — the D80 instrument build; NOT the flathub runtime).

[sdl]
fullscreen = false
output = surface
autolock = false

[render]
scaler = none
aspect = false

[log]
logfile = dbgprobe.log
debuggerrun = debugger

[dosbox]
machine = svga_s3
memsize = 16
captures = captures

[video]
vmemsize = 2

[cpu]
core = normal
cputype = pentium
cycles = fixed 60000
fpu = true

[mixer]
sample accurate = true
rate = 48000

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5

[autoexec]
