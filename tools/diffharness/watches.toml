# tools/diffharness/watches.toml — the P4.2 watch registry (W2)
#
# DESIGN-DIFFHARNESS.md §4 committed as data (decision D77 build order).
# Every row carries:
#   id          stable kebab-case id (used in dump records + diff reports)
#   tier        S0 = frame-tail dump trigger | T0..T4 = watch tiers |
#               TS = static-after-load one-shot (DESIGN §4 statics, dumped
#               once at mission start) | TI = injection surface (§5: watched
#               AND written)
#   exw_addr    EXW (Win95) address expression — the canon of record
#   exd_addr    EXD (DOS oracle) alias from RE-EXD-MAP §4/§5/§5b/§5c.
#               EMPTY = explicit gap (SFX gate only) or a
#               not-yet-aliased tier (T2-T4; TI rows are aliased
#               where their seam is pinned — §5c). Never guessed.
#               (blink-cursor + selection triple were closed by
#               D132; no-extract latch by D133.)
#   indirect    true = EXD keeps the bank behind a pointer cell; read
#               through it (RE-EXD-MAP §7 divergence seed #4).
#   extent      watched byte extent (expression form)
#   layout      record grammar / field offsets for the W6 field map
#   exd_status  verified | derived | gap | unmapped (provenance of the alias)
#   anchor_doc  doc whose ledger holds the anchor row
#   anchor      EXACT ledger row heading (table first cell) or markdown
#               heading string in that doc — the anti-ghost guard
#               (tests/registry_anchors.rs) asserts this string resolves;
#               no unanchored address ever enters this registry.
#
# Ordering: S0, T0, T1, TS, T2, T3, T4, TI.

# ---------------------------------------------------------------- S0 trigger

[[watch]]
id = "s0-trigger"
tier = "S0"
exw_addr = "0x425a03"
exd_addr = "0x5a6eb"
extent = "0 (breakpoint)"
layout = "frame-tail dump point: after the last state writer, before the flip (EXW PresentEnd then g_frame_count++; EXD CALL FUN_00010670 in the mission loop)"
exd_status = "verified"
anchor_doc = "RE-EXD-MAP"
anchor = "2. EXD present/frame-tail site (the S0 dump trigger) — PINNED"
note = "EXW side names the PresentEnd function; the exact MissionShell-tail call-site instruction is a W11 detail recorded in the run manifest (DESIGN §2)."

