name: ci
on:
  push:
  pull_request:

# Least privilege (the frame-pacing.yml pattern): every job here,
# artifact upload included, needs nothing beyond a read-only checkout.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # cpal (bedlam-shell's audio out) builds alsa-sys on Linux; its
      # build script needs the ALSA headers + pkg-config to probe the
      # library. Without this step every ubuntu matrix leg died at
      # clippy --workspace --all-targets before any test executed
      # (>=100 consecutive red runs, ci-cross-os-repair evidence).
      - name: install alsa headers (linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      # P7 "CI artifacts per push" (PLAN §6 P7; docs/P7-PORTS.md §2
      # rows ci-artifacts-per-push + linux-native; proving gate
      # p7-ci-artifacts): every push uploads the RELEASE BINARY built
      # by the step above, one artifact per matrix leg -- the
      # Linux-native artifact (bedlam-shell) and the Windows build
      # artifact (bedlam-shell.exe). The artifact is the ENGINE BINARY
      # ONLY: never game-data, never assets, nothing derived from the
      # corpus (git is engine-only; users supply their own copy).
      # UNSIGNED by design -- key material is the owner-held
      # signing-keys exclusion (D221), so no store, no credential and
      # no runner dependency enters this job; the macOS leg joins when
      # a runner exists (macos-universal2-ci). retention-days is
      # bounded (14) so per-push artifacts do not accumulate at the
      # 90-day default.
      - name: upload linux release binary (per-push artifact)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: bedlam-shell-linux-x86_64
          path: target/release/bedlam-shell
          if-no-files-found: error
          retention-days: 14
      - name: upload windows release binary (per-push artifact)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: bedlam-shell-windows-x86_64
          path: target/release/bedlam-shell.exe
          if-no-files-found: error
          retention-days: 14

  # P4.2/W9 (DESIGN-DIFFHARNESS.md §9 "CI wiring", DH-G3): the
  # differential-harness corpus-gated set as a NAMED CI leg. CI
  # checkouts never carry game-data (it is never committed), so here
  # these tests prove the SKIP-CLEANLY property + compilation; the
  # full pinned-chain assertions run wherever a corpus is present
  # (dev/operator machines run the same commands). Original-side
  # (O1/O2/O3) runs NEVER run in CI: pinned emulator, desktop-gated
  # (the DH-G0 live session). Any test that touches game-data without
  # a corpus_present() guard fails this job on CI — the W9 sweep
  # found exactly one such (menu_gate, fixed with it).
  diffharness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p diffharness
      - run: cargo test -p bedlam-game --test canonical_dump_gate --test differ_gate

  # PLAN sec 7 charter: Miri on bedlam-core + bedlam-audio, from the first
  # tick. Ubuntu-only (miri has no Windows support). The per-tick hash
  # fixture itself runs in the ordinary matrix above - this job adds
  # undefined-behavior detection over both crates test suites.
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # bedlam-core's corpus-gated suites probe game-data on their SKIP
      # paths (std::fs::read in mission_corpus_gate, Path::is_dir in the
      # static_* differentials). Under Miri's default file isolation those
      # probes abort as unsupported operations; the warn policy turns the
      # probe syscall into a clean Err so the suites skip exactly as they
      # do on any corpus-less checkout. The job's charter stays UB
      # detection over the bedlam-core+bedlam-audio suites - corpus IO
      # (miri-hostile, multi-minute) never runs here (ci-cross-os-repair).
      - run: cargo +nightly miri test -p bedlam-core -p bedlam-audio
        env:
          MIRIFLAGS: -Zmiri-isolation-error=warn

  # P7 "Linux native + Flatpak" (PLAN §6 P7; docs/P7-PORTS.md §2 row
  # flatpak-manifest; proving gate p7-flatpak-manifest): the FLATPAK
  # BUILD DEFINITION — on every push this job builds the committed
  # flatpak-builder manifest (packaging/dev.roguefort.bedlam.yml)
  # against the SAME pinned freedesktop runtime the manifest names,
  # then exports an UNSIGNED single-file bundle and uploads it as the
  # per-push flatpak artifact. The bundle carries the ENGINE BINARY
  # ONLY — never the corpus, never assets, never music: the manifest's
  # single dir source skips every original-asset and scratch tree
  # (checker-pinned), and the user supplies their OWN original install
  # at run time (INSTALL_DIR argument; no host grant is baked in).
  # Key material is the owner-held signing-keys exclusion (D221), so
  # nothing here signs anything; store submission is the
  # publication-stores exclusion.
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder flatpak
      # the SDK + rust-stable extension pinned to the SAME
      # runtime-version the manifest carries (the checker joins them).
      - name: install the freedesktop sdk + rust extension
        run: |
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub org.freedesktop.Sdk//24.08 org.freedesktop.Sdk.Extension.rust-stable//24.08
      # build/repo dirs stay OUTSIDE the checkout ($RUNNER_TEMP) so
      # the manifest's repo-root dir source can never nest into
      # itself on the next build.
      - name: build the flatpak bundle
        run: |
          flatpak-builder --force-clean --repo="$RUNNER_TEMP/flatpak-repo" "$RUNNER_TEMP/flatpak-build" packaging/dev.roguefort.bedlam.yml
          flatpak build-bundle "$RUNNER_TEMP/flatpak-repo" packaging/bedlam-shell.flatpak dev.roguefort.bedlam
      - name: upload flatpak bundle (per-push artifact)
        uses: actions/upload-artifact@v4
        with:
          name: bedlam-shell-flatpak-x86_64
          path: packaging/bedlam-shell.flatpak
          if-no-files-found: error
          retention-days: 14

  # P7 "Windows installer" (PLAN sec 6 P7; docs/P7-PORTS.md sec 2
  # row windows-installer; proving gate p7-windows-installer): the
  # WINDOWS INSTALLER BUILD DEFINITION -- on every push this job
  # builds the release engine on the Windows leg, stages the
  # binary next to the committed NSIS script, and compiles THAT
  # script with makensis into the UNSIGNED installer
  # bedlam-shell-setup.exe, uploaded as the per-push installer
  # artifact. The installer carries the ENGINE BINARY ONLY --
  # never the corpus, never art, never music (the checker pins
  # the exact two-file set); the user supplies their OWN original
  # install at run time (the shell's INSTALL_DIR positional
  # argument, or a copy of their install in the shell's own
  # documented default layout inside the install folder -- see
  # windows-installer-README.txt). Key material is the owner-held
  # signing-keys exclusion (D221); a store page is the
  # publication-stores exclusion.
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # not --offline: crates.io is fetched on the runner (no
      # vendored set is committed); --locked pins the versions.
      - run: cargo build --release --locked -p bedlam-shell
      - name: install nsis
        run: choco install nsis -y
      # makensis resolves the script's relative File sources
      # against the script's own directory; staging the binary
      # next to the script AND running makensis with
      # working-directory: packaging makes every relative path
      # resolve to packaging\ under either candidate rule (script
      # directory or process working directory).
      - name: stage the engine binary next to the script
        run: Copy-Item target\release\bedlam-shell.exe packaging\bedlam-shell.exe
      - name: build the installer
        working-directory: packaging
        run: '& "${env:ProgramFiles(x86)}\NSIS\makensis.exe" bedlam-shell.nsi'
      - name: upload windows installer (per-push artifact)
        uses: actions/upload-artifact@v4
        with:
          name: bedlam-shell-windows-installer-x86_64
          path: packaging/bedlam-shell-setup.exe
          if-no-files-found: error
          retention-days: 14

