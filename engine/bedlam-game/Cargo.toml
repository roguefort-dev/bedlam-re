[package]
name = "bedlam-game"
version = "0.1.0"
edition = "2021"

[dependencies]
bedlam-assets = { path = "../bedlam-assets" }
bedlam-audio = { path = "../bedlam-audio" }
bedlam-core = { path = "../bedlam-core" }
bedlam-render = { path = "../bedlam-render" }
thiserror = "1"

[dev-dependencies]
sha2 = "0.10"
# The canonical emitter module (examples/parity_harness/canonical.rs,
# shared into tests/canonical_dump_gate.rs via #[path]) touches
# bedlam-core types directly; integration tests see dev-deps only.
bedlam-core = { path = "../bedlam-core" }
# W6 canonical dump emitter: the shared W3 dump schema + scenario
# grammar (dev-only — the engine production graph is untouched; the
# zero-dep harness crate is already a workspace member).
diffharness = { path = "../../tools/diffharness" }
